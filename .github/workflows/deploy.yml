name: CI/CD Pipeline

on:
  push:
    branches:
      - master

jobs:
  deploy:
    runs-on: self-hosted
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Build images
        run: docker compose build

      - name: Ensure containers are up
        run: docker compose up -d

      - name: Check localhost/java
        run: |
          sleep 5
          curl -fsS http://localhost/java/

      - name: Check localhost/node
        run: curl -fsS http://localhost/node/
