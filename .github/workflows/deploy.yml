name: CI/CD Pipeline

on:
  push:
    branches:
      - master
  workflow_dispatch:

jobs:
  check-changes:
    runs-on: self-hosted
    outputs:
      node: ${{ steps.filter.outputs.node }}
      java: ${{ steps.filter.outputs.java }}
      proxy: ${{ steps.filter.outputs.proxy }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Detect changed paths
        id: filter
        uses: dorny/paths-filter@v4
        with:
          filters: |
            node:
              - 'node/**'
            java:
              - 'java/**'
            proxy:
              - 'nginx/**'
              - 'docker-compose.yml'

      - name: SonarQube Scan
        uses: SonarSource/sonarqube-scan-action@7006c4492b2e0ee0f816d36501671557c97f5995 # v8.1.0
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: ${{ secrets.SONAR_HOST_URL }}

  infra:
    needs: [check-changes]
    runs-on: self-hosted
    defaults:
      run:
        working-directory: terraform
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Terraform init
        run: |
          mkdir -p "$HOME/tf-state"
          terraform init -input=false -backend-config="path=$HOME/tf-state/devops-project.tfstate"

      - name: Terraform format and validate
        run: |
          terraform fmt -check -recursive
          terraform validate

      - name: Terraform plan
        run: terraform plan -input=false -out=tfplan

      - name: Terraform apply
        run: terraform apply -input=false -auto-approve tfplan

  release-java:
    needs: [check-changes, infra]
    if: needs.check-changes.outputs.java == 'true' || github.event_name == 'workflow_dispatch'
    runs-on: self-hosted
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Deploy java-app with Ansible
        run: ansible-playbook -i ansible/inventory.ini ansible/deploy.yml -e service=java-app -e project_dir="$GITHUB_WORKSPACE"

  release-node:
    needs: [check-changes, infra]
    if: needs.check-changes.outputs.node == 'true' || github.event_name == 'workflow_dispatch'
    runs-on: self-hosted
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Deploy node-app with Ansible
        run: ansible-playbook -i ansible/inventory.ini ansible/deploy.yml -e service=node-app -e project_dir="$GITHUB_WORKSPACE"

  release-proxy:
    needs: [check-changes, infra]
    if: needs.check-changes.outputs.proxy == 'true' || github.event_name == 'workflow_dispatch'
    runs-on: self-hosted
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Deploy reverse-proxy with Ansible
        run: ansible-playbook -i ansible/inventory.ini ansible/deploy.yml -e service=reverse-proxy -e project_dir="$GITHUB_WORKSPACE"

  verify-deployment:
    needs: [release-java, release-node, release-proxy]
    if: |
      always() &&
      !contains(needs.*.result, 'failure') &&
      (needs.release-java.result == 'success' ||
       needs.release-node.result == 'success' ||
       needs.release-proxy.result == 'success')
    runs-on: self-hosted
    steps:
      - name: Check nginx health
        run: curl -fsS http://localhost/healthz

      - name: Check localhost/java
        run: curl -fsS http://localhost/java/

      - name: Check localhost/node
        run: curl -fsS http://localhost/node/
